[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wamcast"
dynamic = ["version"]
description = "Neural-operator WAM-IPE surrogate for storm-time thermospheric mass-density forecasting with calibrated uncertainty"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Andong Hu", email = "andong.hu@colorado.edu"},
    {name = "Benjamin McCrossan", email = "mccrossan@hyperios.com"},
]
keywords = [
    "space weather", "thermosphere", "neural operator", "SFNO",
    "WAM-IPE", "uncertainty quantification", "conformal prediction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "pytorch-lightning>=2.2",
    "torch-harmonics>=0.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "h5py>=3.10",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "click>=8.1",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-xdist>=3.5", "pytest-cov>=4.1"]
dev = ["ruff>=0.4", "mypy>=1.9"]

[project.scripts]
wamcast = "wamcast.cli:main"

[project.urls]
Homepage = "https://github.com/HuanWinter/WAM-IPE_surrogate"
Documentation = "https://github.com/HuanWinter/WAM-IPE_surrogate/tree/main/docs"
Repository = "https://github.com/HuanWinter/WAM-IPE_surrogate"
Issues = "https://github.com/HuanWinter/WAM-IPE_surrogate/issues"

[tool.setuptools.dynamic]
version = {attr = "wamcast._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that need GPU or checkpoint download (deselect with -m 'not slow')",
    "gpu: marks tests requiring CUDA",
]
addopts = "-ra --strict-markers"
